version: "3.7"

services:
  web:
    image: nginx:1.30.7-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    restart: always
    environment:
      ZUCO_SERVER_NAMES: ${ZUCO_SERVER_NAMES:?Set the HTTPS server names}
      ZUCO_CERT_NAME: ${ZUCO_CERT_NAME:?Set the existing Certbot certificate name}
      NGINX_ENVSUBST_FILTER: ^ZUCO_
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certificates:/etc/letsencrypt:ro
      - acme-webroot:/usr/share/nginx/html:ro

  app:
    image: emibloque/zuco
    environment:
      BASE_URL: ${BASE_URL:?Set the upstream bucket URL}

volumes:
  certificates:
    external: true
    name: ${ZUCO_CERT_VOLUME:?Set the existing certificate volume name}
  acme-webroot:
